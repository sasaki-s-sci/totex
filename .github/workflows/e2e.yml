name: Desktop E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - name: Install desktop and recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            xvfb ffmpeg webkit2gtk-driver
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: e2e
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --version 2.0.6 --locked
      - run: task test:e2e
      - name: Save video, screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-${{ github.run_attempt }}
          path: test-results/e2e/
          retention-days: 14
          if-no-files-found: warn
