name: Cycle

# Releasing the pages of the app on their own.
#
# The pages the window is drawn out of are replaceable while the app is
# running, so they can be published between two releases of the app and taken
# by a copy that is pointed at them. See `src-tauri/src/release/cycle.rs`,
# which is where a copy is told what a cycle is, and
# `.github/workflows/release.yml`, which is the cycle where everything moves at
# once.
#
# What comes out of this is a release under a tag of its own, holding one
# document and the download it names. It is never what
# `releases/latest/download/...` answers with -- see `make_latest` at the end --
# because the newest release of totex is a release of totex, and pages
# published between two of them must not step in front of one.
on:
  workflow_dispatch:
    inputs:
      part:
        description: Which part of the version turns over
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

# Two of these at once would work the same number out twice and race to push it.
concurrency: release

jobs:
  cut:
    name: Cut a front release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
      version: ${{ steps.version.outputs.to }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Whichever branch this was started from, what is released is what is
          # on main: a tag on anything else names a version nobody can get back
          # to.
          ref: main
          fetch-depth: 0

      - name: Refuse a release nothing could update to
        # Without the key, what is published is a download every installed copy
        # turns down, and a tag is not a thing to have to take back.
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is unset, so nothing could be signed"
            exit 1
          fi

      - name: Work out what this turns over to
        id: version
        env:
          PART: ${{ inputs.part }}
        run: |
          set -euo pipefail

          # The pages carry a number of their own, and the next one is the one
          # after the highest of the numbers in the tree. Two cycles are two
          # sets of tags on one repository, and a version worth naming names
          # one thing: `0.2.0` must not be a version of the pages and a version
          # of the app at the same time.
          conf=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json)
          pkg=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' package.json)

          for carried in "$conf" "$pkg"; do
            if ! printf '%s' "$carried" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::$carried is not a version this knows how to turn over"
              exit 1
            fi
          done

          highest=$(printf '%s\n' "$conf" "$pkg" | sort -V | tail -1)
          IFS=. read -r major minor patch <<<"$highest"
          case "$PART" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::$PART is not a part of a version"; exit 1 ;;
          esac
          next="$major.$minor.$patch"

          if git rev-parse -q --verify "refs/tags/front-v$next" >/dev/null; then
            echo "::error::front-v$next is already a tag"
            exit 1
          fi

          echo "to=$next" >>"$GITHUB_OUTPUT"
          echo "the program is at $conf, the pages at $pkg"
          echo "cutting front-v$next"

      - name: Write it into the pages
        # One file and not three. That is the whole of the difference between
        # this and a release of the app: the pages move and nothing else does,
        # so the version the program carries is still the version it was
        # published under.
        env:
          TO: ${{ steps.version.outputs.to }}
        run: |
          set -euo pipefail
          sed -i "0,/^  \"version\": \"[^\"]*\"/s//  \"version\": \"$TO\"/" package.json
          grep -q "^  \"version\": \"$TO\"" package.json || {
            echo "::error::the version was not written where the pages carry it"
            exit 1
          }
          git --no-pager diff

      - name: Commit it, tag it, and push both
        id: cut
        env:
          TO: ${{ steps.version.outputs.to }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "Turn the front over to $TO" -m \
            "Cut by .github/workflows/cycle.yml, which releases the pages of the app on a cycle of their own."
          git tag -a "front-v$TO" -m "totex front $TO"
          git push origin main "refs/tags/front-v$TO"
          echo "tag=front-v$TO" >>"$GITHUB_OUTPUT"

  build:
    name: Pages
    needs: cut
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the tag was cut on, which is the one carrying the number
          # this release is published under.
          ref: ${{ needs.cut.outputs.tag }}

      - name: Install node, pnpm and task
        uses: jdx/mise-action@v4

      - name: Install npm dependencies
        # For the pages, and for the signer, which is the tauri CLI.
        run: pnpm install --frozen-lockfile

      - name: Pack the pages
        # One job packs them: they are the same pages on all three platforms.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-cycle
          pnpm build
          tar -czf dist-cycle/front.tar.gz -C dist .

      - name: Sign what was built
        # The same key as the installers, so a copy checks this exactly as it
        # checks anything else it downloads.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri signer sign dist-cycle/front.tar.gz
          ls -l dist-cycle

      - name: Upload what was made
        uses: actions/upload-artifact@v7
        with:
          name: cycle-front
          path: dist-cycle/*

  publish:
    name: Publish
    needs: [cut, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cut.outputs.tag }}

      - name: Install node
        uses: jdx/mise-action@v4

      - name: Take what was built
        uses: actions/download-artifact@v7
        with:
          path: dist-cycle
          merge-multiple: true

      - name: Write the document this cycle publishes
        # The same script the app's own releases are written by, told which
        # cycle this is: one document, one shape, one place that knows it.
        env:
          TAG: ${{ needs.cut.outputs.tag }}
        run: |
          node scripts/update-manifest.mjs dist-cycle "$TAG" front
          # Every signature is inside the document by now.
          find dist-cycle -name '*.sig' -delete

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.cut.outputs.tag }}
          name: totex front ${{ needs.cut.outputs.version }}
          files: dist-cycle/*
          fail_on_unmatched_files: true
          # Never what `releases/latest/download/...` answers with. Every
          # address in the README that says `latest` is the app's newest
          # release, and pages published between two of them must not step in
          # front of one. Not a pre-release, though: a copy pointed at this
          # cycle is meant to find this in the list of what it can take, and a
          # pre-release is the one thing that list leaves out.
          make_latest: "false"
          body: |
            The pages of totex, released on a cycle of their own.

            There is nothing to download here by hand. An installed copy takes
            this from its own settings dialog: the row for the pages names
            which release it is pointed at, and this one is offered there
            under **${{ needs.cut.outputs.version }}**.

            The app itself is not this. Its releases are tagged `v*` and hold
            the installers; this holds the pages alone, which the app can
            replace with a reload and without replacing itself.
