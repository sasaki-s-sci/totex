name: Build

on:
  push:
    branches: [main]
    # A tag is what turns a build into a release. Tags come from
    # .github/workflows/release.yml, which works the number out and pushes both
    # the bump and the tag -- and then asks for this build by hand, because a
    # tag pushed by a workflow starts nothing. A tag pushed by a person starts
    # it here, and the two runs are the same run.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # mise's rust backend tracks installs with symlinks, which windows-latest cannot
  # create without Developer Mode, so Rust is installed with rustup instead.
  MISE_DISABLE_TOOLS: rust
  # Keep in sync with the `rust` pin in mise.toml -- the first step enforces this.
  RUST_VERSION: "1.95.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform breaking says nothing about the other two, and knowing
      # which of them broke is the whole point of building all three.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # The oldest runner still supported, deliberately: a bundle links
            # against the glibc it was built on, so building on the newest
            # image is what stops it running on anything older.
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            artifact: totex-linux-x86_64
            layer: totex-layer-linux-x86_64.gz
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            artifact: totex-windows-x86_64
            layer: totex-layer-windows-x86_64.gz
          - name: macOS
            runner: macos-latest
            # One download for both kinds of Mac: tauri builds each half and
            # lipos them together, rather than asking at the download which
            # processor the machine has.
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: totex-macos-universal
            layer: totex-layer-macos-universal.gz

    steps:
      - uses: actions/checkout@v7

      - name: Verify the Rust pin matches mise.toml
        shell: bash
        run: |
          pinned=$(sed -n 's/^rust *= *{ *version *= *"\([^"]*\)".*/\1/p' mise.toml)
          if [ "$pinned" != "$RUST_VERSION" ]; then
            echo "::error file=mise.toml::mise.toml pins rust $pinned but this workflow uses $RUST_VERSION"
            exit 1
          fi

      - name: Verify the installers carry the app's own key
        # The three installers turn down a download that is not signed by the
        # key written into them, and the app turns down an update that is not
        # signed by the one in its config. It is the same key: an installer
        # that would accept something the app would not is a way onto a machine
        # that nobody checked. There is nowhere a shell script, a PowerShell
        # script, a Rust program and a JSON config can all read one string
        # from, so it is written four times, and this is what keeps the four
        # the same string. setup/ is built by a workflow of its own, on a cycle
        # of its own, and is checked here anyway: this is the job that runs on
        # every push, so this is where the key cannot quietly drift apart.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          declared=$(sed -n 's/.*"pubkey": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json)
          if [ -z "$declared" ]; then
            echo "::error file=src-tauri/tauri.conf.json::there is no updater key in here"
            exit 1
          fi
          for carrier in scripts/install.sh scripts/install.ps1 setup/src/release/mod.rs; do
            grep -qF "$declared" "$carrier" || {
              echo "::error file=$carrier::this does not carry the key in src-tauri/tauri.conf.json"
              exit 1
            }
          done
          # Nothing else in the build runs either of them, so this is the only
          # place a typo in one is found before somebody installs with it.
          sh -n scripts/install.sh
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref] $null, [ref] $errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { $_.Message }; exit 1 }'

      - name: Verify the tag names the version being built
        # Nothing downloaded from a release carries the version in its name any
        # more -- see how the installers are collected below -- so the tag is
        # what says which release a file came out of, and the config is what
        # every copy of it will say about itself once it is installed. A tag
        # that disagrees with the config releases a version that cannot be
        # asked for by name: `--version 0.1.5` reads the manifest under that
        # tag and turns down what it finds there for saying something else.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          declared=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json)
          tagged=${GITHUB_REF_NAME#v}
          if [ "$declared" != "$tagged" ]; then
            echo "::error file=src-tauri/tauri.conf.json::tag $GITHUB_REF_NAME does not name version $declared"
            exit 1
          fi
          # The three layers carry their own version each, because each of them
          # can be released on a cycle of its own -- see src-tauri/src/release.
          # A release of the app itself is the cycle where all three move
          # together, so on this tag they are all this number.
          front=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' package.json)
          layer=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' src-tauri/layer/Cargo.toml | head -1)
          for named in "package.json:$front" "src-tauri/layer/Cargo.toml:$layer"; do
            if [ "${named#*:}" != "$tagged" ]; then
              echo "::error file=${named%%:*}::tag $GITHUB_REF_NAME does not name version ${named#*:}"
              exit 1
            fi
          done

      - name: Verify the release can be updated to
        # The updater takes a version whose signature matches the key in the
        # config and nothing else, so a tag built without the private key
        # produces installers that every already-installed copy will refuse.
        # That is only discovered a release later, so it is refused here.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is unset, so nothing could be signed"
            exit 1
          fi

      - name: Install node, pnpm and task
        uses: jdx/mise-action@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust-targets }}

      - name: Install what a Linux bundle is linked against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            file

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Three platforms, three sets of artefacts, one cache otherwise.
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installers
        # `tauri build` runs `pnpm build` first via beforeBuildCommand, which
        # type-checks the frontend, so a type error fails this job too.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # A build with no key to reach -- a pull request from a fork -- still
          # produces working installers. They are only not ones an installed
          # copy will take as an update, and nothing but a tag is released.
          sign=""
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || sign="--no-sign"
          pnpm tauri build --target ${{ matrix.target }} $sign

      - name: Collect the installers under names that do not move
        # Every platform bundles into its own subdirectories under one tree, so
        # they are gathered into a single flat directory here and the two steps
        # that follow are the same on all three.
        #
        # They are renamed on the way, and that is what gives every one of them
        # an address worth writing down. What tauri calls a bundle carries the
        # version in it -- totex_0.1.5_x64-setup.exe -- so the name is a
        # different one at every release, and `releases/latest/download/<name>`,
        # the one URL GitHub offers that always answers with the newest
        # release, cannot be written for a name nobody knows yet. Under a name
        # that is the same at every release it can. That is what the two
        # install scripts have always had, and this is the same thing for the
        # installers somebody would rather click: one link in the README, and
        # no release cut after it was written moves it.
        #
        # The name is the artifact's own, plus what the file is -- and that
        # second half is what scripts/update-manifest.mjs matches a bundle by,
        # so the two lists are one list written twice. Dropping the version out
        # of a name loses nothing: the tag the download hangs under says which
        # release it is, the installers write it into Add/Remove Programs, and
        # the app says it in its own settings dialog.
        shell: bash
        env:
          NAME: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist-release

          # Every bundler writes what it made into a directory of its own, and
          # these are all of them. What is anywhere else under bundle/ is what
          # a bundle was assembled out of rather than a bundle -- the tree an
          # AppImage is built in holds an unpacked copy of the `.deb` beside
          # it -- and none of that is something to publish.
          for made in nsis msi dmg macos appimage deb rpm; do
            for file in "src-tauri/target/${{ matrix.target }}/release/bundle/$made"/*; do
              [ -f "$file" ] || continue
              case "${file##*/}" in
                # The disk image a `.dmg` is written in before it is one.
                rw.*) continue ;;
                *-setup.exe) is='-setup.exe' ;;
                *.msi) is='.msi' ;;
                *.dmg) is='.dmg' ;;
                *.app.tar.gz) is='.app.tar.gz' ;;
                *.AppImage) is='.AppImage' ;;
                *.deb) is='.deb' ;;
                *.rpm) is='.rpm' ;;
                # A signature goes with the file it is beside, below. Anything
                # else in here is something a bundler wanted rather than
                # something it made -- the script that lays out a `.dmg`, the
                # `.app` the tarball beside it was made from.
                *) continue ;;
              esac
              if [ -e "dist-release/$NAME$is" ]; then
                echo "::error::$file is the second thing here wanting to be $NAME$is"
                exit 1
              fi
              cp "$file" "dist-release/$NAME$is"
              # The signature tauri writes beside an updater artifact follows
              # it under the new name. What it signs is the contents of the
              # file, which is the one thing a rename leaves alone.
              if [ -f "$file.sig" ]; then
                cp "$file.sig" "dist-release/$NAME$is.sig"
              fi
            done
          done

          if [ -z "$(ls -A dist-release)" ]; then
            echo "::error::the build finished without producing an installer"
            exit 1
          fi
          ls -l dist-release

      - name: Build the application layer
        # The third of the app that can be replaced while it is running -- see
        # src-tauri/layer. `tauri build` does not make this: it builds the
        # program, and this is a crate of its own beside it, which is the whole
        # reason a release of it can be a download of a few megabytes rather
        # than of eighty.
        #
        # One per kind of machine rather than per kind of installed copy. macOS
        # gets both halves glued into one file, the same way the app does, so
        # that the manifest can point both processors at one download.
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            universal-apple-darwin)
              for half in aarch64-apple-darwin x86_64-apple-darwin; do
                cargo build --manifest-path src-tauri/Cargo.toml -p totex-layer \
                  --release --target "$half"
              done
              built=src-tauri/target/totex-layer-universal
              lipo -create -output "$built" \
                src-tauri/target/aarch64-apple-darwin/release/totex-layer \
                src-tauri/target/x86_64-apple-darwin/release/totex-layer
              ;;
            *)
              cargo build --manifest-path src-tauri/Cargo.toml -p totex-layer \
                --release --target ${{ matrix.target }}
              built="src-tauri/target/${{ matrix.target }}/release/totex-layer"
              [ -f "$built" ] || built="$built.exe"
              ;;
          esac

          # A layer says what it is on the way up and then answers questions
          # until the pipe closes, so a pipe that is closed already is the whole
          # of what it takes to hear it say it. Which is worth doing here: a
          # layer that cannot say what it is, is one every copy of the app would
          # download and then refuse to run.
          said=$(printf '' | "$built" | head -1 || true)
          case "$said" in
            *'"protocol"'*) echo "the layer says $said" ;;
            *)
              echo "::error::the layer that was built does not say what it is"
              exit 1
              ;;
          esac

          gzip -9 -c "$built" >"dist-release/${{ matrix.layer }}"
          ls -l "dist-release/${{ matrix.layer }}"

      - name: Sign the application layer
        # Checked against the same key as the installers and the pages, by the
        # same signer, in the same job -- see the step below this one, which
        # says the whole of why. A build with nothing to sign with signs
        # nothing: the app turns down a layer that is not ours, and nothing but
        # a tag is released.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "there is no key to sign a layer with, so it is left unsigned"
            exit 0
          fi
          pnpm tauri signer sign "dist-release/${{ matrix.layer }}"
          ls -l "dist-release/${{ matrix.layer }}.sig"

      - name: Pack the pages on their own
        # The other half of a release. The pages the window is drawn out of are
        # the same on all three platforms -- one `pnpm build` produces them, and
        # `tauri build` has just run it -- so one job packs them and the other
        # two leave them alone. An installed copy can take these without
        # replacing the program under them, which is the only way a `.deb` or an
        # `.rpm` is ever brought forward by this app at all: see
        # src-tauri/src/front.
        #
        # The contents of dist/ go in at the root of the archive, which is what
        # the app unpacks and reads back as though it had been built in.
        #
        # Signed with the same key, by the same signer, in the same job as the
        # installers beside it: a copy checks a front against the key in its own
        # config before it unpacks a byte of it, exactly as it checks one of
        # these installers. A build with nothing to sign with packs nothing --
        # an unsigned front is one every copy would refuse, and nothing but a
        # tag is released anyway.
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "there is no key to sign a front with, so none is packed"
            exit 0
          fi
          tar -czf dist-release/front.tar.gz -C dist .
          pnpm tauri signer sign dist-release/front.tar.gz
          ls -l dist-release/front.tar.gz dist-release/front.tar.gz.sig

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: Release
    # A tag is a release; a push to main is a build somebody may want to look at.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The one job that writes anything back to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install node
        uses: jdx/mise-action@v4

      - name: Take every platform's installers
        uses: actions/download-artifact@v7
        with:
          path: dist-release
          merge-multiple: true

      - name: Write what the app checks for a new version against
        # The one file in the release that nobody downloads: the app reads it
        # to find out whether there is a newer version and where its own kind
        # of installer for it is. See scripts/update-manifest.mjs.
        shell: bash
        run: |
          node scripts/update-manifest.mjs dist-release "$GITHUB_REF_NAME"
          # Every signature is inside latest.json by now, and what is left in
          # the directory is what the release page offers somebody to download.
          find dist-release -name '*.sig' -delete

      - name: Take the two scripts that install these
        # The two scripts are attached to every release under names that do not
        # change, which is the whole of what gives them a URL that does not
        # change either: releases/latest/download/install.sh is always the
        # newest one, and a release's own copy is always beside the bundles it
        # was cut with.
        run: cp scripts/install.sh scripts/install.ps1 dist-release/

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **macOS and Linux**

            ```sh
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
            ```

            **Windows**

            ```powershell
            irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
            ```

            Both check what they download against the key totex is signed
            with, and both are the same two scripts in every release — nothing
            in them names a version. This one is asked for by name, which a
            script being read down a pipe has to be handed:

            ```sh
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh -s -- --version ${{ github.ref_name }}
            ```

            ```powershell
            & ([scriptblock]::Create((irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1))) -Version ${{ github.ref_name }}
            ```

            The files below are what they download, for anybody who would
            rather click. Their names are the same at every release — no
            version in any of them — which is what makes a link to one worth
            keeping:
            `https://github.com/${{ github.repository }}/releases/latest/download/totex-macos-universal.dmg`
            is the newest release's, today and after every release still to
            come. Swap `latest` for a tag to hold a link to this one.

            | Platform | Download |
            | --- | --- |
            | Windows | `totex-windows-x86_64-setup.exe`, or the `.msi` beside it |
            | macOS | `totex-macos-universal.dmg` — Intel and Apple Silicon in the one file |
            | Linux | `totex-linux-x86_64.AppImage`, `.deb` or `.rpm` |

            Windows has one more, which is on no release page because it
            holds no release: `totex-setup.exe` is a window that asks which
            version to install and installs it, checked against the same key.
            It is published on its own cycle, and its address never changes:
            `https://github.com/${{ github.repository }}/releases/download/setup/totex-setup.exe`

            `latest.json`, `totex-macos-universal.app.tar.gz` and
            `front.tar.gz` are what an installed copy updates itself from;
            there is nothing to download in any of them. The last is the
            window's own pages, which every kind of installed copy can take on
            its own — a `.deb` and an `.rpm` included, where the program itself
            is the package manager's to bring forward.

            None of these are code-signed. macOS holds a downloaded app in
            quarantine until it is let out of it:
            `xattr -dr com.apple.quarantine /Applications/totex.app`. Windows
            SmartScreen says "unknown publisher" — More info, then Run anyway.
