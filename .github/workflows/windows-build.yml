name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # mise's rust backend tracks installs with symlinks, which windows-latest cannot
  # create without Developer Mode, so Rust is installed with rustup instead.
  MISE_DISABLE_TOOLS: rust
  # Keep in sync with the `rust` pin in mise.toml -- the first step enforces this.
  RUST_VERSION: "1.95.0"
  BUNDLE_DIR: src-tauri/target/x86_64-pc-windows-msvc/release/bundle

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Needed only by the release step on a tag push.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Verify the Rust pin matches mise.toml
        shell: bash
        run: |
          pinned=$(sed -n 's/^rust *= *{ *version *= *"\([^"]*\)".*/\1/p' mise.toml)
          if [ "$pinned" != "$RUST_VERSION" ]; then
            echo "::error file=mise.toml::mise.toml pins rust $pinned but this workflow uses $RUST_VERSION"
            exit 1
          fi

      - name: Install node, pnpm and task
        uses: jdx/mise-action@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Windows installers
        # `tauri build` runs `pnpm build` first via beforeBuildCommand, which
        # type-checks the frontend, so a type error fails this job too.
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: totex-windows-x86_64
          path: |
            ${{ env.BUNDLE_DIR }}/msi/*.msi
            ${{ env.BUNDLE_DIR }}/nsis/*.exe
          if-no-files-found: error

      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.BUNDLE_DIR }}/msi/*.msi
            ${{ env.BUNDLE_DIR }}/nsis/*.exe
          generate_release_notes: true
