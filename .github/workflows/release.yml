name: Release

# Build validates main on every push. Only successful, trusted builds may cut
# a release. A completed tag build also wakes this workflow so changes that
# landed while the preceding release was being published can be picked up.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Automatic patch/minor, or an explicit major milestone
        type: choice
        required: true
        default: auto
        options: [auto, major]

permissions:
  contents: read

jobs:
  cut:
    name: Release tested main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    # Only eligible jobs enter the queue. A failed or PR Build must not replace
    # a pending release merely by completing while another release is running.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compare shipped changes with the preceding release
        id: plan
        env:
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$RUNNER_TEMP/releases.json"
          python3 scripts/release.py plan --mode "$MODE" \
            --published "$RUNNER_TEMP/releases.json" --output "$GITHUB_OUTPUT" >"$RUNNER_TEMP/release-plan.json"
          cat "$RUNNER_TEMP/release-plan.json"
          {
            echo '```json'
            cat "$RUNNER_TEMP/release-plan.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Require a successful Build of this exact main commit
        id: tested
        if: steps.plan.outputs.action == 'cut'
        env:
          MODE: ${{ inputs.mode || 'auto' }}
          REQUESTED_SHA: ${{ github.sha }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$MODE" = major ] && [ "$head" != "$REQUESTED_SHA" ]; then
            echo "::error::main moved since this milestone was requested; use auto to resume an existing tag, or request a new milestone on main"
            exit 1
          fi
          # GitHub may expose a release while its assets are still uploading.
          # Wait for that tag's Build to finish before cutting the next one.
          if [ -n "$PREVIOUS" ]; then
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
              -f branch="$PREVIOUS" -f per_page=100 >"$RUNNER_TEMP/previous-runs.json"
            active=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' "$RUNNER_TEMP/previous-runs.json")
            if [ "$active" -gt 0 ]; then
              if [ "$MODE" = major ]; then
                echo "::error::$PREVIOUS is still building; request the milestone after it finishes"
                exit 1
              fi
              echo "The preceding release $PREVIOUS is still building; its completion will try again." >>"$GITHUB_STEP_SUMMARY"
              echo "ready=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f head_sha="$head" -f status=success -f per_page=100 >"$RUNNER_TEMP/build-runs.json"
          count=$(jq --arg repo "$GITHUB_REPOSITORY" '[.workflow_runs[] |
            select(.head_repository.full_name == $repo) |
            select(.event == "push" or .event == "workflow_dispatch") |
            select(.head_branch == "main" or (.head_branch | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | length' \
            "$RUNNER_TEMP/build-runs.json")
          if [ "$count" -eq 0 ]; then
            if [ "$MODE" = major ]; then
              echo "::error::main at $head has not passed Build; retry the milestone after it succeeds"
              exit 1
            fi
            echo "main at $head is still waiting for a successful Build; its completion will try again" >>"$GITHUB_STEP_SUMMARY"
            echo "ready=false" >>"$GITHUB_OUTPUT"
          else
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Require the signing key before creating a tag
        if: steps.plan.outputs.action == 'build' || (steps.plan.outputs.action == 'cut' && steps.tested.outputs.ready == 'true')
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is unset; no release can be signed"
            exit 1
          fi

      - name: Write the version, commit and push main with its tag atomically
        if: steps.plan.outputs.action == 'cut' && steps.tested.outputs.ready == 'true'
        env:
          TO: ${{ steps.plan.outputs.to }}
          TAG: ${{ steps.plan.outputs.tag }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          TESTED_SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          python3 scripts/release.py bump --version "$TO"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml \
            src-tauri/persistent/Cargo.toml src-tauri/Cargo.lock
          git commit -m "Turn the version over to $TO"
          {
            printf 'totex %s\n\n' "$TO"
            if [ -n "$PREVIOUS" ]; then
              git log --format='- %s' "$PREVIOUS..$TESTED_SHA"
            else
              git log --format='- %s' "$TESTED_SHA"
            fi
          } >"$RUNNER_TEMP/tag-message.txt"
          git tag -a "$TAG" -F "$RUNNER_TEMP/tag-message.txt"
          # A newer main makes the entire push fail: neither its history nor
          # the tag is overwritten. The newer main's Build will plan again.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

      - name: Build the new tag or resume an unpublished one
        if: steps.plan.outputs.action == 'build' || (steps.plan.outputs.action == 'cut' && steps.tested.outputs.ready == 'true')
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger another workflow. Dispatch is
          # explicit, and retrying after a failed build reuses the same tag.
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
            -f branch="$TAG" -f per_page=100 >"$RUNNER_TEMP/tag-runs.json"
          active=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' "$RUNNER_TEMP/tag-runs.json")
          if [ "$active" -gt 0 ]; then
            echo "Build is already running for $TAG." >>"$GITHUB_STEP_SUMMARY"
          else
            gh workflow run build.yml --ref "$TAG"
            echo "Dispatched Build for $TAG; it publishes only after all checks and platform builds succeed." >>"$GITHUB_STEP_SUMMARY"
          fi
