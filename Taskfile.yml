version: "3"

vars:
  # The Rust crate lives under src-tauri/, every cargo task is driven from the root.
  CARGO: --manifest-path src-tauri/Cargo.toml
  # The standalone installer is a second crate, released on a cycle of its own.
  # It is built for Windows from wherever it is built, since Windows is the only
  # place it runs; off Windows that wants `rustup target add` first, and the
  # icon and manifest are left out because the tool that compiles them is not
  # there. See setup/build.rs.
  SETUP: --manifest-path setup/Cargo.toml
  SETUP_TARGET: x86_64-pc-windows-msvc

tasks:
  default:
    desc: Run the full local check suite
    cmds:
      - task: check

  setup:
    desc: Install the toolchain pinned in mise.toml and the npm dependencies
    cmds:
      - mise install
      - pnpm install

  dev:
    desc: Run the desktop app with hot reload, on a port reserved for this run
    cmds:
      # Both halves are told the same port: the dev server binds it, and the
      # window is pointed at it. Hard-coding one only works until a dev server
      # from an earlier run is still holding it, which is not a failure worth
      # having to diagnose — and two checkouts can then run side by side.
      - |
        port="$(node scripts/dev-port.mjs)"
        pnpm tauri dev --config "{\"build\":{\"beforeDevCommand\":\"pnpm dev --port $port\",\"devUrl\":\"http://localhost:$port\"}}" {{.CLI_ARGS}}

  start:
    desc: Build the app in release mode and open it (task start -- EXTRA_ARGS)
    cmds:
      # The point here is to look at the production build, not to ship it, so
      # bundling is skipped -- `task build` is what produces the installers.
      - pnpm tauri build --no-bundle {{.CLI_ARGS}}
      # cargo names the binary after the crate, with the host's executable
      # suffix, and tauri leaves it in the crate's target directory.
      - |
        bin="src-tauri/target/release/totex"
        [ -f "$bin" ] || bin="$bin.exe"
        "$bin"

  build:
    desc: Build the installer for the host platform (task build -- EXTRA_ARGS)
    cmds:
      # The installers are also what the app updates itself from, and a build
      # signs them with the release key so that an installed copy can tell one
      # of ours from anything else that answers the same URL. That key is the
      # release workflow's, not a checkout's, so a build without it signs
      # nothing: the installer works, and only the updater would turn it down.
      - task: bundle
        vars: { ARGS: "{{.CLI_ARGS}}" }

  build:windows:
    desc: Build the Windows MSI and NSIS installers (must run on Windows)
    cmds:
      - task: bundle
        vars: { ARGS: "--target x86_64-pc-windows-msvc" }

  bundle:
    internal: true
    cmds:
      - |
        sign=""
        [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || sign="--no-sign"
        pnpm tauri build $sign {{.ARGS}}

  web:build:
    desc: Type-check and bundle the frontend into dist/
    cmds:
      - pnpm build

  icon:
    desc: Regenerate src-tauri/icons from assets/app-icon.svg
    cmds:
      - pnpm tauri icon assets/app-icon.svg

  installer:art:
    desc: Redraw the Windows installer's header strip and its own icon
    cmds:
      # `task icon` cannot make either: one is a BMP, and the other has to be
      # legible on the white of a file list, which the app's white mark is not.
      - node scripts/installer-art.mjs

  setup:build:
    desc: Build the standalone installer, which installs any released totex
    cmds:
      - cargo build {{.SETUP}} --release --target {{.SETUP_TARGET}}

  setup:check:
    desc: Format-check and lint the standalone installer
    # Not part of `task check`: that runs on any machine, and this wants a
    # target that is only there for the asking. The workflow in
    # .github/workflows/setup.yml runs it on every change to setup/.
    cmds:
      - cargo fmt {{.SETUP}} --all -- --check
      - cargo clippy {{.SETUP}} --all-targets --target {{.SETUP_TARGET}} -- -D warnings

  typecheck:
    desc: Type-check the frontend
    cmds:
      - pnpm exec tsc --noEmit

  fmt:
    desc: Format and auto-fix both stacks
    cmds:
      - pnpm exec biome check --write .
      - cargo fmt {{.CARGO}} --all

  fmt:check:
    desc: Fail if either stack is unformatted
    cmds:
      - pnpm exec biome format .
      - cargo fmt {{.CARGO}} --all -- --check

  lint:
    desc: Lint both stacks, treating warnings as errors
    cmds:
      - pnpm exec biome lint .
      - cargo clippy {{.CARGO}} --all-targets --all-features -- -D warnings

  test:
    desc: Run the Rust test suite
    cmds:
      - cargo test {{.CARGO}}

  check:
    desc: Format check, lint, type-check and test
    cmds:
      - task: fmt:check
      - task: lint
      - task: typecheck
      - task: test

  clean:
    desc: Remove build artifacts
    cmds:
      - cargo clean {{.CARGO}}
