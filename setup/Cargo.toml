[package]
name = "totex-setup"
# Not the app's version. This is the installer's own, and it moves when the
# installer does -- which is hardly ever, because nothing in here names a
# release. See the workflow that publishes it.
#
# 2.0.0 is where it started installing rather than downloading the per-version
# installer and running that, which is the whole of what this program is for
# and so the whole of what a major number is for here.
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "totex-setup"
path = "src/main.rs"

[dependencies]
# The same check the app makes of an update and the same one both install
# scripts make of a download, made here without a tool having to be on the
# machine first: `minisign` and an openssl new enough to know BLAKE2b are what
# scripts/install.ps1 hunts for, and a person who came here to click is not
# somebody to send away to install a verifier.
minisign-verify = "0.2.5"
serde_json = "1.0.151"
# Windows' own. Everything this does -- the window, the download, the handing
# over -- is something the machine already has, which is what keeps a file
# nobody re-downloads from carrying a TLS stack that ages.
windows-sys = { version = "0.61.2", features = [
    # Which Windows this actually is, which decides whether the window can be
    # drawn dark at all. See src/paint.rs.
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    # The one part of the window this program does not paint: the title bar.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # The shortcuts, which are COM objects told what they point at and saved.
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    # The line in Add/Remove Programs, and whether there is a webview.
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    # Where the style a static control is made with happens to be kept.
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # Whether the machine is set to high contrast, which decides the whole
    # question of what colour anything is.
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    # Where this account's Start menu and desktop are.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
