[workspace]
# What the app knows about the machine -- which host a path is on, reading
# through a WSL distribution, browsing a folder -- is a crate of its own, so
# that every program in this workspace can link it without linking the window.
# See host/src/lib.rs.
members = ["host", "persistent"]
# Built whenever the app is, so that the program the window starts beside
# itself is beside it in the target directory too.
default-members = [".", "persistent"]

[package]
name = "totex"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"

[lib]
# The desktop binary and the mobile entry point both link against this.
name = "totex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0.151"

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The machine, as the app knows it -- see host/src/lib.rs.
totex-host = { path = "host" }
# The half of the app that cannot be dropped, linked for the client end of
# its socket and the shapes both ends share -- see persistent/src/lib.rs.
totex-persistent = { path = "persistent" }

notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# Taking the front of a newer release without taking the program with it --
# src/front. The program itself is taken by the persistent half -- see persistent/src/update.rs
# -- with the same client and the same key.
base64 = "0.22.1"
dirs = "6.0.0"
flate2 = "1.1.9"
minisign-verify = "0.2.5"
semver = "1.0.28"
tar = "0.4.46"
# The same stack the persistent half reads a release with, chosen the same way: rustls,
# with no provider of its own, and the provider named once by whichever crate
# asks first. See `provider` in src/release/fetch.rs.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }

[dev-dependencies]
# `test` brings in tauri's headless mock runtime, which the window tests drive.
tauri = { version = "2.11.5", features = ["test"] }
