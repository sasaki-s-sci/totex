[package]
name = "totex"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
# The desktop binary and the mobile entry point both link against this.
name = "totex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
portable-pty = "0.9.0"

[dev-dependencies]
# `test` brings in tauri's headless mock runtime, which the window tests drive.
tauri = { version = "2.11.5", features = ["test"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
