[package]
name = "totex-layer"
# Its own number, because it is released on a cycle of its own -- see
# `src/update` in the crate above, which is what decides which version of this
# a copy of the app is running against.
version = "0.1.23"
edition = "2024"
rust-version = "1.95"

[lib]
# What the program above links against, which is the copy of this layer it
# carries and falls back to when there is no other.
name = "totex_layer"
path = "src/lib.rs"

[[bin]]
# And the same thing as something that can be downloaded and run beside it.
name = "totex-layer"
path = "src/main.rs"

[build-dependencies]
serde_json = "1.0.151"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
