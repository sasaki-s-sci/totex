[package]
name = "totex-keep"
# The app's own number: a release of the app carries this program inside it,
# and the window compares the one running against the one it brought.
version = "0.1.28"
edition = "2024"
rust-version = "1.95"

[lib]
# What the window links, for the client half and the shapes both ends share.
name = "totex_keep"
path = "src/lib.rs"

[[bin]]
# And the program itself, which the window starts beside itself and which
# outlives it.
name = "totex-keep"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
portable-pty = "0.9.0"
totex-host = { path = "../host" }
