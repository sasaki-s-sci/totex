<!doctype html>
<!-- The language the words fall back to. src/i18n replaces this with the
     one the reader actually asked their machine for, once that is settled. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>totex</title>
    <style>
      /* What the window is before it has drawn anything.

         A window opens the moment it is asked for and paints whatever the page
         says; a page that says nothing is a white rectangle, and this one is
         dark by preference. So the two colours it is about to be — the ground
         and the column standing on it — are written here, in the document, where
         they cost a parse and no script at all. React clears this out when it
         puts the real column in its place.

         These are `DEFAULT_PRESET`'s grounds, copied — src/theme/presets.ts. A
         window opened on somebody else's preset therefore boots on these and
         arrives on its own a frame later, which is the one thing a preset
         cannot reach: nothing is parsed yet, and a script that ran first would
         cost more than the flash it saved. Revising the default means revising
         the six colours below with it. */
      :root {
        color-scheme: light dark;
      }
      /* Once the window has been told which of the two it is drawn in, that is
         what it is drawn in — here as well as in the palette, so the scrollbars
         and the caret the engine draws for itself agree with the page. `main`
         writes the attribute before the first render; until then, and whenever
         the answer is still the machine's, the two rules below say nothing and
         the media query has it. */
      :root[data-color-scheme="light"] {
        color-scheme: light;
      }
      :root[data-color-scheme="dark"] {
        color-scheme: dark;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #eef1f7;
      }
      .boot {
        display: flex;
        height: 100%;
      }
      /* The folder column, at the width it always starts at. */
      .boot__column {
        width: 288px;
        flex: none;
        background: #ffffff;
        border-right: 1px solid #d5dcea;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #070a11;
        }
        .boot__column {
          background: #141a28;
          border-right-color: #242e44;
        }
      }
      /* And the same two colours again for a window that was told, which beats
         the media query on its own — a dark machine set to a light window opens
         light, rather than opening dark and turning over on the first frame. */
      :root[data-color-scheme="light"] body {
        background: #eef1f7;
      }
      :root[data-color-scheme="light"] .boot__column {
        background: #ffffff;
        border-right-color: #d5dcea;
      }
      :root[data-color-scheme="dark"] body {
        background: #070a11;
      }
      :root[data-color-scheme="dark"] .boot__column {
        background: #141a28;
        border-right-color: #242e44;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><div class="boot__column"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
